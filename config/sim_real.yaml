bridge:
  ros__parameters:
    # topics and namespaces
    ego_namespace: 'ego_racecar'
    ego_scan_topic: 'scan'
    ego_odom_topic: 'odom'
    ego_opp_odom_topic: 'opp_odom'
    ego_drive_topic: 'drive'
    opp_namespace: 'opp_racecar'
    opp_scan_topic: 'opp_scan'
    opp_odom_topic: 'odom'
    opp_ego_odom_topic: 'opp_odom'
    opp_drive_topic: 'opp_drive'

    # LiDAR
    lidar_enabled: True
    lidar_base_link_to_lidar_tf: [0.275, 0.0, 0.0]
    lidar_noise_std: 0.01
    scan_num_beams: 819
    scan_range_min: 0.05
    scan_range_max: 25.0
    scan_angle_min: -135.0
    scan_angle_max: 135.0

    # map
    map_path: 'maps/racetrack_levine_cleaned'
    map_img_ext: '.png'

    # car
    vehicle_params: 'f1tenth'
    scale: 1.0

    num_agent: 1

    # ego starting pose
    sx: 0.0
    sy: 0.0
    stheta: 0.14

    # opp starting pose
    sx1: 2.0
    sy1: 0.5
    stheta1: 0.0

    kb_teleop: True
    use_sim_time: False
    async_mode: True

    # ── Sim-to-real realism knobs ──
    # Tune live: ros2 param set /bridge <param> <value>
    control_noise_std: 0.25   # actuator jitter
    dynamics_noise_std: 1.25  # friction/force variation
    servo_delay_ticks: 3      # ~30-50ms servo lag at ~100Hz sim rate
