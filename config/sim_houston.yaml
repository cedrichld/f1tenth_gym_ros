bridge:
  ros__parameters:
    # topics and namespaces
    ego_namespace: 'ego_racecar'
    ego_scan_topic: 'scan'
    ego_odom_topic: 'odom'
    ego_opp_odom_topic: 'opp_odom'
    ego_drive_topic: 'drive'
    opp_namespace: 'opp_racecar'
    opp_scan_topic: 'opp_scan'
    opp_odom_topic: 'odom'
    opp_ego_odom_topic: 'opp_odom'
    opp_drive_topic: 'opp_drive'

    # LiDAR related parameters
    lidar_enabled: True
    lidar_base_link_to_lidar_tf: [0.275, 0.0, 0.0] # x, y, yaw from base_link to lidar
    lidar_noise_std: 0.01

    # laserscan parameters (default values are SICK TIM571 configuration (270° FOV))
    scan_num_beams: 819
    scan_range_min: 0.05
    scan_range_max: 25.0
    scan_angle_min: -135.0
    scan_angle_max: 135.0

    # map parameters
    map_path: 'maps/houston_main'
    map_img_ext: '.png'

    # car parameters and scale
    vehicle_params: 'f1tenth'
    scale: 1.0

    # 2 agents for overtaking test
    num_agent: 2

    # ego starting pose
    sx: 0.0
    sy: 0.0
    stheta: 0.0

    # opp starting pose — ahead of ego on the straight
    sx1: 3.0
    sy1: -0.3
    stheta1: 0.0

    # teleop
    kb_teleop: True

    use_sim_time: False
    async_mode: True
